# Generated by scripts/generate_manifests.py from prod.auto.tfvars. Do not edit.
#
# One ComputeClass per TPU shape. A pod asks for a shape by name and GKE builds
# a node pool for it, drawing on the reservation, then removes it once the work
# is done.
#
# This is deliberately not a node pool per shape in Terraform. That was a fixed
# partition of one reservation - so many single-chip nodes, so many eight-chip
# nodes, decided at apply time - and a run needing more of one shape queued
# behind its own ceiling while the other shape's chips sat idle. Nothing is set
# aside per shape here. The reservation is the only ceiling and Kueue decides
# who gets it.
---
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: v6e-1x1
spec:
  priorities:
    - tpu:
        type: tpu-v6e-slice
        count: 1
        topology: 1x1
      # Specific, because the reservation is specificReservationRequired: a
      # node that does not name it asks for on-demand capacity and fails.
      reservations:
        affinity: Specific
        specific:
          - name: cloudtpu-20260828173000-731402396
            project: cloud-ullm-inference-ci-cd
            # The reservation is zonal and the cluster pins no zones, so this
            # is the only thing keeping a node out of a zone that cannot serve
            # it. It belongs on the reservation and not in spec.location, which
            # GKE Warden rejects outright next to a specific reservation.
            zones: [us-east5-a]
  nodePoolAutoCreation:
    enabled: true
  nodePoolConfig:
    # Otherwise an auto-created pool runs as the project's default compute
    # account, which carries far more than a node needs.
    serviceAccount: tpu-ci-wkr-us-east5@cloud-ullm-inference-ci-cd.iam.gserviceaccount.com
    # A test image here is tens of gigabytes and a pod reads part of it, so
    # starting before the pull finishes is most of the cold start.
    imageStreaming:
      enabled: true
  # One reservation, and no on-demand fallback worth having: a TPU this lane
  # cannot reserve should leave the work queued until a node frees up, not
  # quietly buy capacity at list price. Explicit because the default changed in
  # 1.33.
  whenUnsatisfiable: DoNotScaleUp
